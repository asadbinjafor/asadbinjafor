<style>text{font-family:Consolas,Menlo,DejaVu Sans Mono,monospace;font-variant-ligatures:none}.headline{opacity:0}.h0{opacity:1;animation:head0 15s infinite}.h1{animation:head1 15s infinite}.h2{animation:head2 15s infinite}
