<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-labelledby="title desc">
<title id="title">Mohammad Asad Bin Jafor — Full Stack Web Developer</title><desc id="desc">Custom terminal profile for Mohammad Asad Bin Jafor. Cyan and violet on midnight blue.</desc>
